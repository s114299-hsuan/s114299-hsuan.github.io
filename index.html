<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生活紀錄 - 喫茶時光</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="bg-texture"></div>

<section id="login-page" class="login-page">
  <div class="login-card retro-border">
    <div class="card-header">
        <h1>生活記錄帖</h1>
        <p class="subtitle">—— 專注 · 紀錄 · 餘裕 ——</p>
    </div>
    <div class="login-inputs">
      <input id="username" type="text" placeholder="請輸入帳號">
      <input id="password" type="password" placeholder="請輸入密碼">
    </div>
    <button id="login-btn" class="retro-btn primary-btn">進入系統</button>
    <button id="register-btn" class="retro-btn secondary-btn">登記新帳號</button>
    <p id="login-msg"></p>
  </div>
</section>

<section id="app-page" class="hidden">
  <header class="app-header">
    <div class="brand">
        <h2>生活記錄帖</h2>
    </div>
    <div class="header-right">
        <span id="user-display" class="user-badge"></span>
        <button id="delete-account-btn" class="retro-btn danger-btn-small">帳號註銷</button>
        <button id="logout-btn" class="retro-btn ghost-btn">登出</button>
    </div>
  </header>

  <nav class="app-nav">
    <button onclick="showSection('home-section')" class="nav-btn">首頁</button>
    <button onclick="showSection('habit-section')" class="nav-btn">習慣</button>
    <button onclick="showSection('schedule-section')" class="nav-btn">行程</button>
  </nav>

  <main class="app-main">
    
    <section id="home-section">
      <div class="welcome-card retro-border">
        <h3>貴安，<span id="welcome-user"></span></h3>
        <p class="date-tag">本日：<span id="today-date-display"></span></p>
        <div class="status-summary">
          <p>「日日是好日，專注當下即是永恆。」</p>
          <hr class="retro-hr">
          <small>請由上方選單切換功能。</small>
        </div>
      </div>
    </section>

    <section id="habit-section" class="hidden">
      <div class="section-title">
        <h3>每日修煉</h3>
        <p>持之以恆，方得始終</p>
      </div>
      <div class="input-group retro-form">
        <input type="text" id="new-habit-input" placeholder="欲養成之習慣... (按 Enter 登錄)">
        <button id="add-habit-btn" class="retro-btn action-btn">登錄</button>
      </div>
      <ul id="habit-list" class="retro-list"></ul>
    </section>

    <section id="schedule-section" class="hidden">
      <div class="section-title">
        <h3>日程安排</h3>
        <p>光陰似箭，切勿虛度</p>
      </div>
      <div class="schedule-controls retro-form">
        <input type="date" id="schedule-date-input">
        <input type="time" id="schedule-time-input">
        <input type="text" id="new-schedule-input" placeholder="事項內容... (按 Enter 登錄)">
        <button id="add-schedule-btn" class="retro-btn action-btn">登錄</button>
      </div>
      
      <div class="timeline-header">
        <h4 id="current-view-date-label"></h4>
      </div>
      
      <div class="timeline-container">
        <ul id="schedule-list" class="timeline-list"></ul>
      </div>
    </section>

  </main>
</section>

<script src="script.js"></script>
</body>
</html>
